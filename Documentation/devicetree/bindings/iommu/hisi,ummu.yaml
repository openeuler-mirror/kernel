%YAML 1.2
---
$id: http://devicetree.org/schemas/iommu/hisi,ummu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon UMMU Architecture Implementation

maintainers:
  - Jingbin Wu <wujingbin2@huawei.com>

description: |+
  UMMU is an IOMMU device that performs address translation and permission checking
  using DstEID, TokenID, and UBA as input parameters.

properties:
  $nodename:
    pattern: "^ummu@[0-9a-f]*"
  compatible:
    const: ub,ummu
  index:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      UMMU device index. Used to identify a specific UMMU instance in systems
      with multiple UMMU devices.
  msi-parent:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: |
      MSI parent device phandle. Required for MSI interrupt handling.
  interrupt-affinity:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      maxItems: 1
    description: |
      Specifies a list of phandles to CPU nodes to which the UMMU event queue
      and global error interrupts should be affine. The syntax is the same as
      the ``interrupt-affinity`` property of the ARM PMU binding, i.e. each
      entry is a single phandle without additional arguments, but the
      semantics differ: entries are not matched to individual interrupts,
      and all listed CPUs form one CPU mask which is applied to both
      interrupts. When omitted, the default interrupt placement is used.

required:
  - compatible
  - index
  - msi-parent

additionalProperties: false

examples:
  - |+
    ummu@0 {
        compatible = "ub,ummu";
        index = <0x0>;
        msi-parent = <&its>;
        interrupt-affinity = <&cpu1>, <&cpu3>;
    };
